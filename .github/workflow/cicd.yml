name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - feature

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  TF_WORKING_DIR: ./devops

jobs:

  # ============================================================
  # 1. SECURITY + COST SCAN
  # ============================================================

  scan:
    name: Security & Cost Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # GITLEAKS
      # --------------------------------------------------------

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # TFSEC
      # --------------------------------------------------------

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}


      # --------------------------------------------------------
      # TERRASCAN
      # --------------------------------------------------------

      - name: Run Terrascan
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform
          iac_dir: ${{ env.TF_WORKING_DIR }}
          iac_version: v14
          policy_type: azure
          only_warn: false


      # --------------------------------------------------------
      # TERRAFORM FORMAT CHECK
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      # --------------------------------------------------------
      # INFRACOST
      # --------------------------------------------------------

      - name: Infracost Scan
        uses: infracost/actions/scan@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          path: ${{ env.TF_WORKING_DIR }}


  # ============================================================
  # 2. AZURE LOGIN + TERRAFORM PLAN
  # ============================================================

  plan:
    name: Azure Login & Terraform Plan
    needs: scan

    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AZURE OIDC LOGIN
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # TERRAFORM
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # TERRAFORM INIT
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # --------------------------------------------------------
      # TERRAFORM VALIDATE
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # --------------------------------------------------------
      # TERRAFORM PLAN
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_resource_group_name: ${{ vars.TF_RESOURCE_GROUP_NAME }}
          TF_VAR_location: ${{ vars.TF_LOCATION }}

        run: |
          terraform plan \
            -out=tfplan
          
          terraform show tfplan


      # --------------------------------------------------------
      # UPLOAD PLAN
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan


  # ============================================================
  # 3. APPLY
  # ============================================================

  apply:
    name: Terraform Apply
    needs: plan

    # Apply ONLY after code reaches main
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # AZURE LOGIN
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # TERRAFORM
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # TERRAFORM INIT
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # --------------------------------------------------------
      # DOWNLOAD PLAN
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}


      # --------------------------------------------------------
      # TERRAFORM APPLY
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_resource_group_name: ${{ vars.TF_RESOURCE_GROUP_NAME }}
          TF_VAR_location: ${{ vars.TF_LOCATION }}

        run: |
          terraform apply -auto-approve tfplan
